        :root {

            --text-main: #2C3E50;

        }

            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(186, 220, 247, 0.7);
            box-shadow: 0 12px 32px -8px rgba(56, 136, 214, 0.1);
        }
        .option-btn {
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            border: 1.5px solid #E1EEF8;
            background: #FFFFFF;
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #74B4F0;
            box-shadow: 0 8px 20px -6px rgba(56, 136, 214, 0.14);
        }
        .fade-enter {
            animation: fadeInSlide 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .ticket-cutout {
            position: relative;
        }
        .ticket-cutout::before,
        .ticket-cutout::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 24px;
            height: 24px;
            background-color: #EEF6FC;
            border-radius: 50%;
            transform: translateY(-50%);
            border: 1px solid rgba(186, 220, 247, 0.6);
        }
        .ticket-cutout::before {
            left: -13px;
        }
        .ticket-cutout::after {
            right: -13px;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F4F9FD;
        }
        ::-webkit-scrollbar-thumb {
            background: #BDD8F0;
            border-radius: 9999px;
        }

            if (state.history.length > 0) {

            } else {
                backBtn.classList.add('hidden');
                backBtn.classList.remove('inline-flex');
                resetTopBtn.classList.add('hidden');
            }

            progressBar.style.width = (STEP_PROGRESS[state.step] || 15) + '%';

            container.classList.remove('fade-enter');

            container.classList.add('fade-enter');

            switch (state.step) {

            const vbStore = DB.volleyballStores[state.selectedVbKey || getRecommendedVbKey()];
            const din = state.dinner;

            let lines = [
                `❄️ 【我們的小小約・行程表】`,
                `• 出發時間：${state.departTime}（新北土城醫院出發）`,
                `• 第一站（${cityObj.name}）：${rest ? rest.name : ''}`,
                `  🅿 停車：${rest ? rest.parking : ''}`
            ];

            if (act) {
                const actName = subSpot ? `${act.title} - ${subSpot.name}` : `${act.title}（${act.place}）`;
                lines.push(`• 下午行程：${actName}`);
            }

            if (state.wantVolleyball && vbStore) {
                lines.push(`• 順路逛排球店：🏐 ${vbStore.name}（${vbStore.address}）`);
            }

            if (state.planType !== 'no_ski') {
                lines.push(`• 🚗 結束後前往新豐小叮噹滑雪場（16:30 報到換裝 / 17:30–20:30 滑雪，希望我們學得會滑雪！）`);
            }

            if (din) {
                const dinNames = din.items.map(i => i.name).join(' / ');
                lines.push(`• 晚餐宵夜：${din.category}（${dinNames}）`);
            }

            const textToCopy = lines.join('\n');
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("已複製行程文字！可以直接貼到 Line 囉！");
            } catch (err) {
                showToast("複製失敗，請直接截圖畫面～");
            }
            document.body.removeChild(textArea);
        }

        function showToast(msg) {
            const toast = document.getElementById('toastBox');
            const toastText = document.getElementById('toastText');
            toastText.textContent = msg;
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2600);
        }

        window.onload = function () {
            render();
        };
    </script>
</body>
</html>
